<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="lib/battle.js"></script>
    <script src="lib/fx.js"></script>
    <script src="lib/gg.js"></script>
    <script src="vendor/three.min.js"></script>
    <script src="lib/flyover.js"></script>
    <script src="lib/globe.js"></script>
    <script src="lib/board.js"></script>
    <script src="lib/living.js"></script>
    <script src="lib/engage.js"></script>
    <link rel="stylesheet" href="lib/battle.css" />
    <style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("assets/fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("assets/fonts/oswald-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Cinzel"; font-weight: 600; src: url("assets/fonts/cinzel-latin-600-normal.woff2") format("woff2"); }
/* DATE PLATE (owner 2026-11-14, replaces the parchment scroll): warm charcoal plate, gold hairline + gold left bar, ivory Cinzel caps, sized to the current date */
#date { width: auto !important; height: 100px; box-sizing: border-box; overflow: hidden; background: rgba(21,17,12,.85); border: 1px solid rgba(200,168,106,.55);
        border-left: 5px solid #c8a86a; box-shadow: 0 10px 26px rgba(10,6,2,.5); z-index: 62; }
#date .scroll, #date .roll { display: none !important; }
#date .d { position: absolute; left: 0; top: 0; inset: auto; height: 100px; padding: 0 34px 0 30px; display: flex; align-items: center; justify-content: flex-start;
           font-family: "Cinzel", Georgia, serif !important; font-weight: 600; font-size: 52px !important; letter-spacing: .07em; color: #efe3c8; white-space: nowrap; }
@font-face { font-family: "Special Elite"; font-weight: 400; src: url("assets/fonts/special-elite-latin-400-normal.woff2") format("woff2"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
        <div id="world">
          <img id="relief" src="assets/relief.jpg" alt="" />
          <img id="relief2" src="assets/relief_close.jpg" alt="" style="position:absolute;left:0;top:0;width:2880px;height:1620px;opacity:0" />
          <svg id="overlay" viewBox="0 0 2880 1620" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="pins"></div>
        </div>
        <div id="fx"></div>
        <div id="vignette"></div>
        <img id="grain" src="assets/grain.png" alt="" />
        <div id="date"><div class="scroll"></div><div class="roll l"></div><div class="roll r"></div></div>
        <style>#vignette{background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(8,8,4,0.72) 100%) !important}#vignette{opacity:0}#grain{opacity:0 !important}#credit{display:none !important}.unit .fxk-flag{display:none !important}</style>
        <div id="credit">{{CREDIT}}</div>
      </div>
    </div>
    <script>
{{SCENE_JS}}
      document.querySelectorAll("img").forEach((i) => { if (i.style.mixBlendMode === "multiply") i.classList.add("terr"); }); // E1 tone-down (battle.css)
      window.__timelines["main"] = B.tl;
      B.tl.seek(0);
    </script>
  </body>
</html>
