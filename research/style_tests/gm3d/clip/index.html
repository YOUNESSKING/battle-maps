<script>
  // ONE paused timeline, registered synchronously; the module below draws world + fx + troops from it, the overlay chains O.update on it.
  window.__timelines = window.__timelines || {};
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady.gm3dClip = new Promise((res) => { window.__clipBuilt = res; });
  window.__clk = { t: 0 }; window.__draw = null;
  const tl = gsap.timeline({ paused: true });
  tl.to(window.__clk, { t: T.D, duration: T.D, ease: "none", onUpdate: () => { if (window.__draw) window.__draw(window.__clk.t); } }, 0);
  window.__timelines["main"] = tl; window.__tl = tl;

<script type="module">
import * as THREE from "three";
import { initWorld } from "./world.js";
import { createFX } from "./fx.js";
const T = window.T, EV = window.EV, tl = window.__tl, D = window.GM3D_DATA;
const W = 1280, H = 720, SC = 1.5;   // overlay space = 1.5 x canvas px
const U = 1 / D.geo.mpu;             // world units per metre (1 unit = 129.36 m)
const BR = D.regions.close.bridge, BRW = D.regions.close.breastworks;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// ---------------- camera beats (world units = map units) ----------------
// v3 GM cloud dive, built from what his wide->battlefield dives share (1814 video at 478, 636, 768, 902 s, measured at 15 fps; see DETAIL_STUDY.md):
// push-in on the wide 3D map (his gold numbers / our title float in world space) -> clouds appear and fill the frame in ~0.8 s ->
// cool off-white cloud interior ~0.6 s (~#d0d4cc, flat) -> the cut hides in it -> warm cream ~0.7 s (centre ~#dad6c6, edge ~#c3c1b0)
// with dark grey-brown wisps (cloud undersides) rushing past -> the battlefield snaps in within ~0.4 s, a thin haze clears over ~1 s.
const DV = { push: 11.3, deckIn: 14.85, deck: 15.2, wIn: 15.6, wFull: 16.0, SW: 16.4, warm: 16.35, emerge: 17.2, clear: 17.6, haze: 18.7, land: 18.6 };
const SW = DV.SW;   // region swap, inside the flat white-out
const keys = [
  { t: 0.0, region: "wide", at: [1560, 712], dist: 640, tilt: 46, yaw: -3, fov: 30 },
  { t: DV.push, region: "wide", at: [1532, 709], dist: 560, tilt: 44, yaw: 0, fov: 30 },
  { t: DV.deck, region: "wide", at: [1518, 706], dist: 122, tilt: 26, yaw: 1, fov: 30, ease: "in" },
  { t: SW, region: "close", at: [1517.6, 705], dist: 75, tilt: 24, yaw: 1, fov: 31, ease: "lin" },
  { t: DV.land, region: "close", at: [1519.6, 704.6], dist: 40, tilt: 38, yaw: -2, fov: 32, ease: "out" },
  { t: T.p3 - 0.5, region: "close", at: [1520.2, 705.4], dist: 36, tilt: 50, yaw: -5, fov: 30 },
  { t: T.taken + 0.4, region: "close", at: [1520.0, 706.2], dist: 30, tilt: 52, yaw: -10, fov: 30 },
  { t: T.bburn + 2.2, region: "close", at: [1515.0, 705.4], dist: 25, tilt: 54, yaw: -14, fov: 30 },
  { t: T.p4 - 0.6, region: "close", at: [1514.6, 705.3], dist: 27.5, tilt: 53, yaw: -12, fov: 30 },
  { t: T.p4 - 0.6, region: "wide", at: [1398, 688], dist: 300, tilt: 44, yaw: 0, fov: 30, night: 1, ease: "cut" },
  { t: T.p5 - 0.6, region: "wide", at: [1378, 694], dist: 230, tilt: 46, yaw: -4, fov: 30, night: 1 },
  { t: T.p5 - 0.6, region: "close", at: [1514.0, 705.0], dist: 34, tilt: 50, yaw: -4, fov: 30, ease: "cut" },

const world = initWorld(document.getElementById("gl"), { base: "assets/", keys, width: W, height: H, antialias: false, shadowSize: 1536, bridgeBurnT: EV.bridgeFire + 3.2 });
await world.ready;
const hC = (x, y) => world.heightAt(x, y, "close"), hW = (x, y) => world.heightAt(x, y, "wide");

// ---------------- fx: one instance per region scene (same camera + renderer) ----------------
const SUN = [-0.7, 0.48, -0.4];
const mkFX = (r, seed, hf) => createFX({ scene: world.regions[r].scene, camera: world.camera, renderer: world.renderer, unitsPerMeter: U, fxScale: r === "close" ? 9 : 40,
  wind: [20, -7], sunDir: SUN, heightAt: hf, duration: T.D, seed });
const fxW = mkFX("wide", 1863, hW), fxC = mkFX("close", 1517, hC);
fxW.patchGround(world.regions.wide.terrain.material); fxC.patchGround(world.regions.close.terrain.material);
// clouds (v3): sprite cumulus on the wide map = scattered fair-weather clouds + the dense dive deck around the bridge
// (fades in at DV.deckIn, gone after the swap); each cloud shades the ground under it. Close map keeps the volumetric layer:
// the camera falls out of its base during the emergence, then only its shadows drift over the battlefield.
const M = 1 / U;   // metres per unit
const hsh = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const sparse = [], deck = [];
for (let i = 0, gx = 1250; gx < 1820; gx += 62) for (let gz = 560; gz < 920; gz += 62, i++) if (hsh(i, 1) < 0.26) sparse.push([gx + hsh(i, 2) * 54, gz + hsh(i, 3) * 54, 14 + hsh(i, 4) * 16]);
for (let i = 0, gx = 1410; gx < 1630; gx += 25) for (let gz = 615; gz < 830; gz += 25, i++) {
  const x = gx + (hsh(i, 5) - 0.5) * 18, z = gz + (hsh(i, 6) - 0.5) * 18, r = Math.hypot(x - 1518, (z - 725) * 1.2);
  if (hsh(i, 7) < lerp(0.86, 0.42, clamp(r / 110))) deck.push([x, z, 13 + hsh(i, 8) * 14, 0.97 + hsh(i, 9) * 0.06]); }
for (const c of [[1518, 706, 30], [1512, 717, 28], [1526, 699, 26], [1521, 726, 28], [1507, 697, 24], [1531, 713, 26], [1515, 738, 26]]) deck.push([c[0], c[1], c[2], 1]);   // the camera's own column: no gap to fall through
fxW.cumulus({ clouds: sparse, base: 52, lift: 1.1, puffs: 26, refR: 18, puffSize: 0.9, seed: 71, drift: 0.5, shadowDir: [0.3, 1, 0.18], shadowH: 58 });
fxW.cumulus({ clouds: deck, base: 68, lift: 1.25, puffs: 46, refR: 22, puffSize: 0.8, seed: 72, drift: 0.5, nearFade: 0.3, alpha: (t) => sstep(DV.deckIn, DV.deckIn + 0.15, t) * (1 - sstep(SW, SW + 0.2, t)) });
const covC = (t) => lerp(0.85, 0.36, sstep(DV.emerge - 0.2, DV.clear + 0.3, t));
fxC.clouds({ base: 48 * M, top: 104 * M, tile: 260 * M, coverage: covC, shadow: 0.40, resolution: 0.5, steps: 40, detail: 0.5, maxDist: 600 * M, maxSeg: 70 * M, lightStep: 3 * M, sigma: 0.05 / M });

// cold open: the bridge already burning, seen from altitude (a fleck of fire + a dark column bending downwind)
fxW.fire(GWd(BR.x, BR.z, 0.6), EV.bridgeFireWide - 3, T.dive + 1, { size: 6, flameK: 1.0, flameA: 0.7, flameRate: 6, emberRate: 1, glowSize: 2.2, smokeRate: 1.6, smokeLife: 14, rise: 2, light: false, ramp: 2, smokeTint: [0.16, 0.15, 0.14], smokeAlpha: 0.55, smokeS0: 0.9, smokeGrow: 1.6, smokeWind: 3 });
// close: smoke lines, cannon, impacts, bridge fire
const brDir = [Math.cos(-BR.angle), -Math.sin(-BR.angle)], deckY = (BR.deck * 6) / D.geo.mpu, L2 = BR.len / 2;
const BA = [BR.x - brDir[0] * L2, deckY + 0.05, BR.z - brDir[1] * L2], BB = [BR.x + brDir[0] * L2, deckY + 0.05, BR.z + brDir[1] * L2];
fxC.fire(BA, EV.bridgeFire, T.p4 - 1.2, { to: BB, size: 1.0, flameK: 1.25, flameA: 0.5, glowSize: 4, flameRate: 16, emberRate: 14, smokeRate: 6.0, smokeLife: 12, rise: 5, ramp: 1.2, fadeOut: 0.5, smoulder: 0, lightIntensity: 2, smokeTint: [0.14, 0.13, 0.12], smokeAlpha: 0.5, smokeS0: 2.2, smokeGrow: 6, smokeWind: 3.2 });
fxC.fire(BA, T.p5 - 1, T.D + 2, { to: BB, size: 0.45, flameRate: 3, emberRate: 1, glowSize: 1.5, smokeRate: 1.2, smokeLife: 8, rise: 6, ramp: 0.1, light: false, smokeTint: [0.3, 0.29, 0.28] });   // still smouldering next day
const bwPts = BRW.filter((_, i) => i % 3 === 0).map((p) => G(p[0] + 0.12, p[1], 0.06));
fxC.smokeLine(bwPts, EV.volleyCS[0], EV.volleyCS[1], { dir: [1, 0.05], rate: 1.8, volley: 1.6, roll: 0.9, size: 1.35, height: 3, alpha: 0.15, tint: [0.58, 0.62, 0.68] });
fxC.smokeLine([G(1525.8, 698.6, 0.06), G(1525.4, 703.5, 0.06), G(1525.6, 708.0, 0.06), G(1525.1, 712.0, 0.06)], EV.volleyUS[0], EV.volleyUS[1] - 1.8, { dir: [-1, 0], rate: 0.8, size: 1.3, alpha: 0.12, life: 9, tint: [0.58, 0.62, 0.68] });
fxC.smokeLine([G(1523.0, 706.5, 0.06), G(1522.6, 709.5, 0.06), G(1522.4, 712.0, 0.06)], 31.8, EV.volleyUS[1], { dir: [-1, 0], rate: 0.9, size: 1.3, alpha: 0.11, life: 9, tint: [0.58, 0.62, 0.68] });
EV.usShots.forEach((t, i) => { const g = EV.usGuns[i % 3]; fxC.cannon(G(g[0], g[1], 0.05), t, { dir: [-1, 0.05 * (i % 3 - 1)], size: 1.0, puffs: 8 });
  fxC.impact(G(1520.2 + ((i * 37) % 7) * 0.15, g[1] + ((i * 53) % 9 - 4) * 0.35, 0), t + 0.85, { size: 0.9 }); });
EV.csShots.forEach((t, i) => { const g = EV.csGuns[i % 3]; fxC.cannon(G(g[0], g[1], 0.05), t, { dir: [1, -0.04 * (i % 3 - 1)], size: 1.0, puffs: 8 });
  fxC.impact(G(1526.3 + ((i * 29) % 7) * 0.25, g[1] + ((i * 41) % 9 - 4) * 0.4, 0), t + 0.8, { size: 0.9 }); });
// flashback: the burning steamer drifting down the Mississippi at Vicksburg, the batteries firing on the boats, town lights
const MISS = D.regions.wide.rivers[0].pts;
const riverAt = (y) => { let b = MISS[0]; for (const p of MISS) if (Math.abs(p[1] - y) < Math.abs(b[1] - y)) b = p; return b; };
const st0 = riverAt(684), st1 = riverAt(703);
fxW.fire(GWd(st0[0], st0[1], 0.4), EV.steamer, EV.steamer + 2.6, { to: GWd(lerp(st0[0], st1[0], 0.35), lerp(st0[1], st1[1], 0.35), 0.4), size: 0.55, glowSize: 26, smokeRate: 1.8, smokeLife: 10, rise: 7, ramp: 0.8, fadeOut: 0.6, lightIntensity: 3 });
fxW.fire(GWd(lerp(st0[0], st1[0], 0.35), lerp(st0[1], st1[1], 0.35), 0.4), EV.steamer + 2.4, T.p5, { to: GWd(st1[0], st1[1], 0.4), size: 0.55, glowSize: 26, smokeRate: 1.8, smokeLife: 10, rise: 7, ramp: 0.4, lightIntensity: 3 });
const VB = D.towns.Vicksburg;
EV.batteryShots.forEach((t, i) => { const a = (i * 0.9) % 3; fxW.cannon(GWd(VB[0] - 2 + a * 2.2, VB[1] - 5 + i * 1.9, 0.3), t, { dir: [-1, 0.1], size: 0.6, puffs: 6, dust: 0 });
  const r = riverAt(VB[1] - 3 + i * 3); fxW.impact(GWd(r[0], r[1], 0.1), t + 0.9, { size: 0.5 }); });
for (let i = 0; i < 14; i++) { const a = i * 2.39996, rr = 1.2 + (i % 5) * 1.1; fxW.campfire(GWd(VB[0] + Math.cos(a) * rr * 1.3, VB[1] + Math.sin(a) * rr, 0.2), { t0: T.p4 - 1, t1: T.p5, size: 1.4, smoke: false, visible: () => 1 }); }
fxW.setNight(0);

// ---------------- the 3D title: gold letters floating in world space over the map (GM's '70,000'), passing over the lens ----------------
await document.fonts.load('600 120px "CG"');
const TC = document.createElement("canvas"); TC.width = 2048; TC.height = 1024; { const g = TC.getContext("2d");
  const lines = ["THE BRIDGE", "THAT BURNED TO", "SAVE VICKSBURG"], fs = [210, 150, 210], ys = [250, 520, 800];
  g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
  lines.forEach((ln, i) => { g.font = `600 ${fs[i]}px "CG", Georgia, serif`; if ("letterSpacing" in g) g.letterSpacing = "8px";
    const gr = g.createLinearGradient(0, ys[i] - fs[i] * 0.42, 0, ys[i] + fs[i] * 0.42); gr.addColorStop(0, "#fff3c8"); gr.addColorStop(0.45, "#e2bd62"); gr.addColorStop(0.55, "#b8862e"); gr.addColorStop(1, "#f0d488");
    g.strokeStyle = "#2a1c08"; g.lineWidth = 16; g.strokeText(ln, 1024, ys[i]);
    g.strokeStyle = "#8a6222"; g.lineWidth = 7; g.strokeText(ln, 1024, ys[i]);
    g.fillStyle = gr; g.fillText(ln, 1024, ys[i]); }); }
const ttex = new THREE.CanvasTexture(TC); ttex.colorSpace = THREE.SRGBColorSpace; ttex.anisotropy = 4;
const TTL = new THREE.Group(); world.regions.wide.scene.add(TTL);
const tA = 12.2; world.update(tA); world.camera.updateMatrixWorld();
const cq = world.camera.quaternion.clone(), cpos = world.camera.position.clone(), cfw = new THREE.Vector3(0, 0, -1).applyQuaternion(cq), cup = new THREE.Vector3(0, 1, 0).applyQuaternion(cq);
const tD = 0.40 * world.cameraAt(tA).dist, tW = 0.58 * tD, tH = tW / 2;
TTL.position.copy(cpos).addScaledVector(cfw, tD).addScaledVector(cup, 0.30 * 0.268 * tD); TTL.quaternion.copy(cq);
const tMats = [];
for (let k = 9; k >= 0; k--) { const front = k === 0;
  const m = new THREE.MeshBasicMaterial({ map: ttex, transparent: true, alphaTest: 0.35, depthWrite: true, fog: false, color: front ? 0xffffff : new THREE.Color().setRGB(0.32 - k * 0.018, 0.22 - k * 0.013, 0.09) });
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(tW, tH), m); pl.position.set(-k * tW * 0.0018, -k * tW * 0.0016, -k * tW * 0.0042); pl.renderOrder = 20 - k; TTL.add(pl); tMats.push(m); }
const tShadow = fxW.planeShadow({ tex: ttex, dir: [-0.22, 1, -0.12] });
const tAx = new THREE.Vector3(1, 0, 0).applyQuaternion(cq).divideScalar(tW), tAy = new THREE.Vector3(0, 1, 0).applyQuaternion(cq).divideScalar(-tH);
const titleAt = (t) => { const a = sstep(T.story, T.story + 0.7, t) * (1 - sstep(DV.deck - 0.4, DV.deck, t)); TTL.visible = a > 0.002 && world.region === "wide";
  for (const m of tMats) m.opacity = a; TTL.scale.setScalar(0.94 + 0.06 * sstep(T.story, T.story + 1.2, t)); tShadow(TTL.position, tAx, tAy, TTL.visible ? a : 0); };

// ---------------- 3D extras: boats on the Mississippi (flashback), three new bridges (next day) ----------------
const boatMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1c }), boats = [];
for (let i = 0; i < 6; i++) { const b = new THREE.Group(); const hull = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.75), boatMat); b.add(hull);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.2, 6), boatMat); st.position.set(0.3, 0.8, 0); b.add(st); world.regions.wide.scene.add(b); boats.push(b); }
const placeBoats = (t) => { for (let i = 0; i < boats.length; i++) { const y = 662 + (t - (T.p4 - 1)) * 1.6 - i * 4.2, p = riverAt(y), q = riverAt(y + 1);
  boats[i].position.set(p[0] + (i % 2 ? 0.6 : -0.6), (p[2] * 14) / D.geo.mpu + 0.35, p[1]); boats[i].rotation.y = Math.atan2(-(q[1] - p[1]), q[0] - p[0]); boats[i].visible = t > T.p4 - 1 && t < T.p5; } };
const RIV = D.regions.close.rivers[0].pts, wood = new THREE.MeshLambertMaterial({ color: 0x6b5236 }), newBridges = [];
[[702.0, 0], [707.8, 1], [709.6, 2]].forEach(([y, k]) => { let b = RIV[0]; for (const p of RIV) if (Math.abs(p[1] - y) + (p[0] < 1500 ? 99 : 0) < Math.abs(b[1] - y) + (b[0] < 1500 ? 99 : 0)) b = p;
  const i = RIV.indexOf(b), a = RIV[Math.max(0, i - 3)], c = RIV[Math.min(RIV.length - 1, i + 3)], ang = Math.atan2(c[1] - a[1], c[0] - a[0]);
  const g = new THREE.Group(); const wl = (b[2] * 6) / D.geo.mpu;
  const deck = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 1.5), wood); deck.castShadow = deck.receiveShadow = true; g.add(deck);
  for (let j = -3; j <= 3; j++) { const pt = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.03, 0.07), new THREE.MeshLambertMaterial({ color: 0x3d3428 })); pt.position.set(0, -0.015, j * 0.21); g.add(pt); }
  g.position.set(b[0], wl + 0.012, b[1]); g.rotation.y = -ang; world.regions.close.scene.add(g); newBridges.push({ g, t: EV.bridgesNew[k] }); });

// ---------------- our troops: Style W boxes pinned to the ground (many small blocks per brigade) ----------------
