<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Living Map Test</title>
<script src="../../../../grant/scenes/s12d_rt/vendor/gsap.min.js"></script>
<script src="rivers_px.js"></script>
<script src="river_label.js"></script>
<script src="living.js"></script>
<style>
  html, body { margin: 0; background: #111; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #5f6a38; }
  #world { position: absolute; left: 0; top: 0; width: 2880px; height: 1620px; transform-origin: 0 0; }
  #world > img { position: absolute; left: 0; top: 0; width: 2880px; height: 1620px; }
  #overlay { position: absolute; left: 0; top: 0; width: 2880px; height: 1620px; overflow: visible; }
  #pins { position: absolute; left: 0; top: 0; }
  .unit { position: absolute; }
  .unit .blk { background: #2c4f8c; border: 2px solid #f1ecd8; box-shadow: 0 1px 3px rgba(0,0,0,.55); box-sizing: border-box; }
  .unit svg { width: 100%; height: 100%; display: block; }
  #tc { position: absolute; right: 24px; bottom: 18px; font: 600 26px/1 sans-serif; color: #fff; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<div id="root">
  <div id="world">
    <img id="relief" src="../../../../grant/assets/vicksburg_w.jpg" alt="" />
    <img id="rivers" src="../../roads_towns/rivers/rivers_w.png" alt="" />
    <svg id="overlay" viewBox="0 0 2880 1620" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="pins"></div>
  </div>
  <div id="tc"></div>
</div>
<script>
// test scene: camera s = 1.7 on the Big Black / Mississippi (map px), 11 s
const S = 1.7, CX = 1400, CY = 760;
gsap.set("#world", { x: 960 - CX * S, y: 540 - CY * S, scale: S });
window.tl = gsap.timeline({ paused: true });
tl.set({}, {}, 11);
riverLabel.fontUrl = "../../rr_cards/fonts/eb-garamond-latin-500-italic.woff2";

// a Union column marching west on the Jackson road (Edwards -> Big Black bridge)
const W = 62, H = 36, pins = document.getElementById("pins"), unit = document.createElement("div");
unit.className = "unit"; unit.style.width = W + "px";
unit.innerHTML = `<div class="blk" style="width:${W}px;height:${H}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 100 M100 0 L0 100" stroke="#f1ecd8" stroke-width="7"/></svg></div>`;
pins.appendChild(unit);
const WP = [[1770, 689], [1740, 691], [1700, 684], [1668, 679], [1640, 688], [1624, 699], [1606, 693], [1580, 698], [1548, 702]];
gsap.set(unit, { left: WP[0][0] - W / 2, top: WP[0][1] - H / 2 });
{ let len = 0; for (let i = 1; i < WP.length; i++) len += Math.hypot(WP[i][0] - WP[i - 1][0], WP[i][1] - WP[i - 1][1]);
  let t = 0.8; const T = 8.6;
  for (let i = 1; i < WP.length; i++) { const d = Math.hypot(WP[i][0] - WP[i - 1][0], WP[i][1] - WP[i - 1][1]) / len * T;
    tl.to(unit, { left: WP[i][0] - W / 2, top: WP[i][1] - H / 2, duration: d, ease: "none" }, t); t += d; } }

// living map
const L = LivingW({ tl });
L.water("mask_water.png", { paths: [RIVERS_PX.mississippi.pts, RIVERS_PX.big_black.pts, RIVERS_PX.pearl.pts], lanes: { 0: [-5, 0, 5] } });
L.clouds({});
L.dust(unit, 0.8, 9.4);
if (!location.search.includes("nolight")) {   // ?nolight = check the clouds/water/dust alone
  L.light("morning", 0, { dur: 0 });
  L.light("afternoon", 2.4, { dur: 2.2 });
  L.light("dusk", 5.4, { dur: 2.2 });
  L.light("night", 8.0, { dur: 2.0 });
}

// river names on their spoken words
const R = RIVERS_PX;
riverLabel("miss", "Mississippi River", R.mississippi.pts, 0.6, { s: S, size: 27, hw: 15, near: [1282, 540], side: "left" });
riverLabel("bb", "Big Black River", R.big_black.pts, 2.9, { s: S, size: 25, hw: 4.5, near: [1560, 585], side: "above" });
riverLabel("pearl", "Pearl River", R.pearl.pts, 5.6, { s: S, size: 25, hw: 4.5, near: [1878, 905], side: "left" });

const tc = document.getElementById("tc");
window.__seek = (t) => { tl.seek(t, false); tc.textContent = "t = " + t.toFixed(1) + " s"; };
document.fonts.load('italic 500 20px "RL Garamond"').then(() => document.fonts.ready).then(() => { __seek(0); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
