<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="vendor/gsap.min.js"></script>
<script src="timing.js"></script>
<style>
@font-face { font-family: "Cinzel"; font-weight: 600; src: url("assets/fonts/cinzel-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Cinzel"; font-weight: 700; src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "EB Garamond"; font-weight: 500; src: url("assets/fonts/eb-garamond-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "EB Garamond"; font-weight: 600; src: url("assets/fonts/eb-garamond-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "EB Garamond"; font-weight: 500; font-style: italic; src: url("assets/fonts/eb-garamond-latin-500-italic.woff2") format("woff2"); }
:root { --cream: #f4eedd; --ink: #1a1712; --gold: #c9a24a; --blue: #2c57b7; --red: #be3a2a; }
html, body { margin: 0; background: #000; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#scene { position: absolute; inset: 0; overflow: hidden; }
#sky { position: absolute; inset: 0; background: linear-gradient(180deg, #c9cfc9 0%, #d9d6c4 30%, #b7ad8a 60%, #8d855f 100%); }
.cam { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 50%; }
.plane { position: absolute; left: -960px; top: -540px; width: 3840px; height: 2160px; }
.pl { position: absolute; inset: 0; }
.plane > img.ground { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; }
.plane svg.ovl { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; overflow: visible; }
.pin { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.bbi { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; }
/* Style W unit box (our troops): side colour, white type symbol with ink casing, ink border, echelon above */
.unit .ech { font-family: "EB Garamond", serif; font-weight: 600; color: var(--ink); letter-spacing: .04em; line-height: 1; text-shadow: 0 0 3px #f4eedd, 0 0 3px #f4eedd, 0 0 5px #f4eedd; margin-bottom: 3px; }
.unit .box { position: relative; border: 3px solid var(--ink); box-shadow: 0 6px 10px rgba(0,0,0,.45); }
.unit .box svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.unit.u .box { background: var(--blue); } .unit.r .box { background: var(--red); }
.unit.x .box { background: #8a857a; }
.lbl { font-family: "EB Garamond", serif; font-weight: 600; color: var(--cream); white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6); letter-spacing: .02em; }
.lblcaps { font-family: "Cinzel", serif; font-weight: 600; letter-spacing: .28em; color: var(--cream); white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6); }
/* gold medallion + black plate + thin pole */
.med { display: flex; flex-direction: column; align-items: center; }
.med .ring { border-radius: 50%; padding: 7px; background: radial-gradient(circle at 35% 30%, #fbe7a8, #c9a24a 45%, #7a5a1c 100%); box-shadow: 0 10px 22px rgba(0,0,0,.55), inset 0 0 6px rgba(0,0,0,.5); }
.med .face { border-radius: 50%; overflow: hidden; background: radial-gradient(circle, #6f6450, #2b261c); box-shadow: inset 0 0 18px rgba(0,0,0,.7); }
.med .face img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.45) contrast(1.05); }
.med .plate { margin-top: -10px; background: #12100c; border: 2px solid var(--gold); padding: 6px 18px 7px; text-align: center; box-shadow: 0 6px 12px rgba(0,0,0,.5); }
.med .role { font-family: "Cinzel", serif; font-weight: 600; color: var(--gold); letter-spacing: .22em; }
.med .nm { font-family: "EB Garamond", serif; font-weight: 600; color: var(--cream); white-space: nowrap; }
.med .role { white-space: nowrap; }
.med .pole { width: 2px; background: linear-gradient(#e8d39a, #c9a24a); box-shadow: 0 0 3px rgba(0,0,0,.6); }
/* HUD */
.hud { position: absolute; }
.parch { background: linear-gradient(160deg, #f1e6c8 0%, #e6d6ae 55%, #d9c697 100%); border: 1.5px solid #8a6d38; box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 0 22px rgba(120,85,30,.35); color: #2a2016; }
.smallcaps { font-family: "Cinzel", serif; font-weight: 600; letter-spacing: .2em; }
.gar { font-family: "EB Garamond", serif; }
#watch { left: 46px; top: 40px; width: 470px; height: 132px; display: flex; align-items: center; gap: 18px; padding: 0 22px; box-sizing: border-box; }
#watch .txt { position: relative; flex: 1; height: 100px; }
#watch .mode { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; }
#tline { left: 300px; right: 300px; bottom: 34px; height: 76px; padding: 10px 26px; box-sizing: border-box; background: rgba(14,12,9,.82); border-top: 2px solid var(--gold); color: var(--cream); }
#ledger { right: 46px; top: 40px; width: 430px; padding: 18px 24px 20px; box-sizing: border-box; }
.lrow { display: flex; align-items: baseline; gap: 12px; font-family: "EB Garamond", serif; font-weight: 600; font-size: 22px; border-top: 1px solid rgba(90,64,30,.35); padding: 6px 0 4px; }
.lrow .n { font-family: "Cinzel", serif; width: 22px; color: #6b4b1e; }
.lrow .st { margin-left: auto; font-family: "Cinzel", serif; font-size: 15px; letter-spacing: .16em; padding: 2px 8px; border: 2px solid; rotate: -4deg; }
.tag { background: rgba(14,12,9,.86); border-left: 5px solid var(--gold); padding: 12px 24px 13px; color: var(--cream); box-shadow: 0 10px 24px rgba(0,0,0,.5); }
.tag .h { font-family: "Cinzel", serif; font-weight: 700; letter-spacing: .2em; font-size: 24px; }
.tag .s { font-family: "EB Garamond", serif; font-style: italic; font-weight: 500; font-size: 24px; color: #e2d6b8; margin-top: 2px; }
#grain { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: overlay; opacity: .22; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 48%, rgba(10,8,4,.62) 100%); }
#warm { position: absolute; inset: 0; mix-blend-mode: soft-light; background: linear-gradient(115deg, rgba(255,190,110,.35), rgba(255,190,110,0) 70%); }
#night { position: absolute; inset: 0; background: rgba(18,32,62,.62); mix-blend-mode: multiply; opacity: 0; }
.cloud { position: absolute; left: -240px; top: -135px; width: 2400px; height: 1350px; opacity: 0; }
.cshadow { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; opacity: .16; mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="66" data-width="1920" data-height="1080">
 <div id="scene" class="clip" data-start="0" data-duration="66" data-track-index="0">
  <div id="sky"></div>
  <div class="cam" id="camW"><div class="plane w" id="planeW"><img class="ground" src="assets/plane_wide.jpg" alt=""><img class="cshadow" id="cshW" src="assets/cshadow.png" alt=""><svg class="ovl" id="ovlW" viewBox="0 0 3840 2160"></svg></div><div class="pl" id="plW"></div></div>
  <div class="cam" id="camC"><div class="plane c" id="planeC"><img class="ground" src="assets/plane_close.jpg" alt=""><img class="cshadow" id="cshC" src="assets/cshadow.png" alt=""><svg class="ovl" id="ovlC" viewBox="0 0 3840 2160"></svg></div><div class="pl" id="plC"></div></div>
  <div id="warm"></div>
  <div id="night"></div>
  <img class="cloud" id="cl1" src="assets/clouds.png" alt="">
  <img class="cloud" id="cl2" src="assets/clouds.png" alt="">
  <div id="fog" style="position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 50%, rgba(246,244,238,.97) 0%, rgba(232,230,222,.92) 55%, rgba(205,203,196,.85) 100%)"></div>
  <img class="cloud" id="cl3" src="assets/clouds.png" alt="">
  <div id="hud"></div>
  <img id="grain" src="assets/grain.png" alt="">
  <div id="vig"></div>
 </div>
</div>
<script>
const D = T.D, tl = gsap.timeline({ paused: true });
const NS = "http://www.w3.org/2000/svg", HUD = document.getElementById("hud");
const PW = document.getElementById("planeW"), PC = document.getElementById("planeC");
const OW = document.getElementById("ovlW"), OC = document.getElementById("ovlC");
const TILT = { W: 34, C: 40 };
const R = (a) => a * Math.PI / 180;
// camera: put plane point (px, py) at the screen centre at scale S (rotation is about the plane centre; z puts that point back on the z = 0 plane)
const look = (px, py, S, tilt) => { const dx = px - 1920, dy = py - 1080; return { x: -S * dx, y: -S * dy * Math.cos(R(tilt)), z: -S * dy * Math.sin(R(tilt)), scale: S, rotationX: tilt }; };
const cam = (pl, tilt, a, b, t0, t1, ease = "sine.inOut") => { tl.set(pl, look(...a, tilt), t0); tl.fromTo(pl, look(...a, tilt), { ...look(...b, tilt), duration: t1 - t0, ease, immediateRender: false }, t0); };
const show = (el, t, d = 0.6, o = {}) => tl.fromTo(el, { autoAlpha: 0, ...(o.from || {}) }, { autoAlpha: 1, duration: d, ease: "power2.out", immediateRender: false, ...(o.to || {}) }, t);
const hide = (el, t, d = 0.6) => tl.to(el, { autoAlpha: 0, duration: d, ease: "power1.in" }, t);
const mk = (html, css, parent = HUD) => { const e = document.createElement("div"); e.className = "hud"; e.style.cssText = css; e.innerHTML = html; parent.appendChild(e); gsap.set(e, { autoAlpha: 0 }); return e; };

// ---------- billboard pins on a plane (stand up against the tilt) ----------
// pins are screen-space billboards: each frame they are projected from their plane point with the plane's current camera (no CSS preserve-3d)
const PINS = [], PERSP = 1500;
const pin = (plane, x, y, html, o = {}) => { const p = document.createElement("div"); p.className = "pin";
  p.innerHTML = `<div class="bbi" style="${o.css || ""}">${html}</div>`; document.getElementById(plane === PW ? "plW" : "plC").appendChild(p); if (!o.visible) gsap.set(p, { autoAlpha: 0 });
  p._d = { plane, x, y, dx: 0, dy: 0 }; PINS.push(p); return p; };
const project = () => { const cache = new Map();
  for (const p of PINS) { const d = p._d; let c = cache.get(d.plane);
    if (!c) { const g = (k) => gsap.getProperty(d.plane, k); const a = R(g("rotationX")); c = { x: g("x"), y: g("y"), z: g("z"), s: g("scale"), cos: Math.cos(a), sin: Math.sin(a) }; cache.set(d.plane, c); }
    const vx = c.s * (d.x + d.dx - 1920), vy = c.s * (d.y + d.dy - 1080), rx = vx + c.x, ry = vy * c.cos + c.y, rz = vy * c.sin + c.z, f = PERSP / (PERSP - rz);
    p.style.transform = `translate(${(960 + rx * f).toFixed(2)}px, ${(540 + ry * f).toFixed(2)}px) scale(${(c.s * f).toFixed(4)})`; } };
const INK = "#1a1712";
const SYM = {
  inf: `<svg viewBox="0 0 100 70" preserveAspectRatio="none"><g stroke-linecap="square"><line x1="0" y1="0" x2="100" y2="70" stroke="${INK}" stroke-width="13"/><line x1="100" y1="0" x2="0" y2="70" stroke="${INK}" stroke-width="13"/><line x1="0" y1="0" x2="100" y2="70" stroke="#f4eedd" stroke-width="6"/><line x1="100" y1="0" x2="0" y2="70" stroke="#f4eedd" stroke-width="6"/></g></svg>`,
  art: `<svg viewBox="2 18 96 78"><g fill="#f4eedd" stroke="${INK}" stroke-width="3"><rect x="40" y="31" width="56" height="8" rx="3" transform="rotate(-22 44 50)"/><path d="M30 42 L52 36 L56 52 L34 58 Z"/><circle cx="36" cy="66" r="13" fill="none" stroke="#f4eedd" stroke-width="6"/><path d="M33 60 L6 84 L12 89 L40 66 Z"/></g></svg>`,
  eng: `<svg viewBox="0 0 100 70"><g transform="translate(50 35)"><circle r="17" fill="none" stroke="#f4eedd" stroke-width="8"/>${[0,45,90,135,180,225,270,315].map((a) => `<rect x="-5" y="-27" width="10" height="11" fill="#f4eedd" transform="rotate(${a})"/>`).join("")}<circle r="6" fill="${INK}"/></g></svg>`,
};
const U = {};
const unit = (id, plane, side, x, y, type, ech, o = {}) => { const w = o.w || 72, h = Math.round(w * 0.68);
  const el = pin(plane, x, y, `<div class="unit ${side}" id="u_${id}"><div class="ech" style="font-size:${Math.round(h * 0.56)}px">${ech}</div><div class="box" style="width:${w}px;height:${h}px">${SYM[type]}</div></div>`);
  U[id] = el; return el; };
const move = (id, t, d, x, y, ease = "sine.inOut") => { const dd = U[id]._d; tl.to(dd, { dx: x - dd.x, dy: y - dd.y, duration: d, ease }, t); };
const capture = (id, t) => { const b = U[id].querySelector(".box"); tl.to(b, { backgroundColor: "#8a857a", duration: 0.8 }, t); tl.to(U[id], { autoAlpha: 0.75, duration: 0.8 }, t); };
const label = (plane, x, y, txt, size, t, until, caps) => { const el = pin(plane, x, y, `<div class="${caps ? "lblcaps" : "lbl"}" style="font-size:${size}px">${txt}</div>`); show(el, t, 0.9); if (until) hide(el, until, 0.8); return el; };
const medal = (plane, x, y, img, role, name, t, until, sz = 170, pole = 150) => {
  const el = pin(plane, x, y, `<div class="med"><div class="ring"><div class="face" style="width:${sz}px;height:${sz}px"><img src="${img}" alt=""></div></div><div class="plate"><div class="role" style="font-size:${Math.round(sz * 0.085)}px">${role}</div><div class="nm" style="font-size:${Math.round(sz * 0.16)}px">${name}</div></div><div class="pole" style="height:${pole}px"></div></div>`);
  gsap.set(el.querySelector(".med"), { autoAlpha: 0 }); tl.fromTo(el.querySelector(".med"), { autoAlpha: 0, y: 30, scale: 0.85 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)", immediateRender: false }, t); gsap.set(el, { autoAlpha: 1 });
  if (until) tl.to(el.querySelector(".med"), { autoAlpha: 0, duration: 0.7 }, until); return el; };
// solid tapered arrow lying on the terrain, drawn on along its path
const arrow = (svg, pts, col, w, t, dur, until) => {
  const sm = []; for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 12; k++) { const f = k / 12; sm.push([pts[i][0] * (1 - f) + pts[i + 1][0] * f, pts[i][1] * (1 - f) + pts[i + 1][1] * f]); } sm.push(pts[pts.length - 1]);
  for (let it = 0; it < 4; it++) for (let i = 1; i < sm.length - 1; i++) sm[i] = [(sm[i - 1][0] + 2 * sm[i][0] + sm[i + 1][0]) / 4, (sm[i - 1][1] + 2 * sm[i][1] + sm[i + 1][1]) / 4];
  const n = sm.length, head = w * 2.6, L = [], Rr = []; let tot = 0; const acc = [0]; for (let i = 1; i < n; i++) { tot += Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]); acc.push(tot); }
  let iH = n - 1; while (iH > 0 && tot - acc[iH] < head) iH--;
  for (let i = 0; i <= iH; i++) { const a = sm[Math.max(0, i - 1)], b = sm[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, hw = (w * (0.35 + 0.65 * acc[i] / acc[iH])) / 2;
    L.push([sm[i][0] - dy / d * hw, sm[i][1] + dx / d * hw]); Rr.push([sm[i][0] + dy / d * hw, sm[i][1] - dx / d * hw]); }
  const a = sm[iH], tip = sm[n - 1], dx = tip[0] - a[0], dy = tip[1] - a[1], d = Math.hypot(dx, dy) || 1, hw = w * 1.15;
  const poly = [...L, [a[0] - dy / d * hw, a[1] + dx / d * hw], tip, [a[0] + dy / d * hw, a[1] - dx / d * hw], ...Rr.reverse()];
  const g = document.createElementNS(NS, "g"), id = "m" + (window.__am = (window.__am || 0) + 1);
  g.innerHTML = `<defs><mask id="${id}" maskUnits="userSpaceOnUse"><path d="M${sm.map((q) => q.join(" ")).join(" L")}" stroke="#fff" stroke-width="${w * 4}" fill="none" stroke-linecap="round"/></mask></defs>` +
    `<polygon points="${poly.map((q) => q.join(",")).join(" ")}" fill="${col}" stroke="${INK}" stroke-width="${w * 0.12}" stroke-linejoin="round" mask="url(#${id})" style="filter:drop-shadow(0 ${w * 0.25}px ${w * 0.3}px rgba(0,0,0,.45))" opacity=".93"/>`;
  svg.appendChild(g); const mp = g.querySelector("mask path"); const len = tot + w * 4;
  gsap.set(mp, { strokeDasharray: `${len} ${len}`, strokeDashoffset: len }); gsap.set(g, { autoAlpha: 0 });
  tl.set(g, { autoAlpha: 1 }, t); tl.to(mp, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t); if (until) tl.to(g, { autoAlpha: 0, duration: 0.8 }, until); return g; };
// fire + rising powder smoke (billboards), deterministic flicker
const fire = (plane, x, y, t, until, s = 1) => { const el = pin(plane, x, y, `<div style="position:relative;width:${90 * s}px;height:${110 * s}px">
   <div class="fl" style="position:absolute;left:0;bottom:0;width:100%;height:100%;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 80%, #fff6c8 0%, #ffc04a 25%, rgba(240,90,20,.85) 50%, rgba(160,30,0,0) 72%);filter:blur(${2 * s}px)"></div></div>`);
  show(el, t, 0.5); const fl = el.querySelector(".fl"); for (let k = 0; t + k * 0.23 < until; k++) tl.to(fl, { scaleY: 0.82 + 0.3 * ((k * 37) % 7) / 7, scaleX: 0.9 + 0.15 * ((k * 53) % 5) / 5, duration: 0.23, ease: "sine.inOut", transformOrigin: "50% 100%" }, t + k * 0.23);
  hide(el, until, 1.0); smoke(plane, x, y - 40 * s, t + 0.2, until, s * 1.4, true); return el; };
const smoke = (plane, x, y, t, until, s = 1, dark) => { for (let i = 0; t + i * 0.7 < until; i++) { const r = (60 + (i * 29) % 40) * s;
    const el = pin(plane, x + ((i * 47) % 50 - 25) * s, y, `<div style="width:${r}px;height:${r}px;border-radius:50%;background:radial-gradient(circle, ${dark ? "rgba(52,46,40,.75)" : "rgba(235,232,222,.8)"} 0%, ${dark ? "rgba(70,64,58,.35)" : "rgba(220,216,205,.35)"} 50%, rgba(0,0,0,0) 72%)"></div>`);
    const t0 = t + i * 0.7; tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 0.9, duration: 0.5, immediateRender: false }, t0); tl.fromTo(el.querySelector("div"), { scale: 0.5 }, { scale: 1, duration: 0.5, immediateRender: false }, t0);
    tl.to(el.querySelector("div"), { y: -160 * s, x: 60 * s, scale: 2.4, duration: 3.6, ease: "sine.out" }, t0); tl.to(el, { autoAlpha: 0, duration: 2.4 }, t0 + 1.2); } };
const SFXQ = []; const SFX = (k, t) => SFXQ.push([k, +t.toFixed(2)]);

// ---------- coordinates ----------
const WP = (x, y) => [(x - 1180) * 4.5714, (y - 470) * 4.5714];   // wide plane (map units of vicksburg_hd_lift 2880 frame)
const VICK = WP(1388, 681), BR_W = WP(1512, 706), JACK = WP(1885, 724), EDW = WP(1599.4, 716.4), CH = WP(1625, 700);
const BR = [1712, 1046];   // close plane: the Big Black bridge (railroad/road crossing)

// ================= SHOT 1 (cold open, wide, 0 - dive) =================
gsap.set(PW, look(1700, 1080, 0.62, TILT.W)); gsap.set(PC, look(2100, 1050, 0.85, TILT.C)); gsap.set("#camC", { autoAlpha: 0 });
cam(PW, TILT.W, [1760, 1120, 0.6], [1500, 1080, 0.78], 0, T.dive - 0.4);
label(PW, VICK[0] - 60, VICK[1] - 40, "Vicksburg", 64, 0.3);
label(PW, JACK[0], JACK[1] - 40, "Jackson", 56, 0.5);
label(PW, EDW[0] + 40, EDW[1] + 70, "Edwards", 42, 0.7);
label(PW, 1830, 500, "Big Black River", 46, 1.0, T.dive);
// distance card + dashed strategic line bridge -> Vicksburg (dashed only on this wide map)
{ const l = document.createElementNS(NS, "path"); l.setAttribute("d", `M${BR_W[0]} ${BR_W[1]} L${VICK[0] + 30} ${VICK[1] + 10}`); l.setAttribute("stroke", "#f4eedd"); l.setAttribute("stroke-width", "6"); l.setAttribute("stroke-dasharray", "18 14"); l.setAttribute("fill", "none"); l.style.filter = "drop-shadow(0 2px 3px rgba(0,0,0,.7))"; OW.appendChild(l); show(l, 1.2, 0.8); hide(l, T.burned + 2.5); }
const dist = mk(`<div class="tag" style="text-align:center;border-left:0;border-top:3px solid var(--gold)"><div class="h" style="font-size:40px;letter-spacing:.12em">ABOUT 10 MILES</div><div class="s">Big Black bridge to Vicksburg · as the crow flies</div></div>`, "left:0;right:0;top:250px;display:flex;justify-content:center;");
show(dist, 1.4, 0.7, { from: { y: 16 }, to: { y: 0 } }); hide(dist, T.burned - 0.3);
// troops (wide): Confederates fall back west over the bridge; Union columns come from the east
unit("wr1", PW, "r", BR_W[0] + 70, BR_W[1] + 10, "inf", "XX", { w: 66 }); unit("wr2", PW, "r", BR_W[0] + 90, BR_W[1] + 90, "inf", "XX", { w: 66 });
