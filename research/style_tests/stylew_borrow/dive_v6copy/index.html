     all driven by ONE paused GSAP timeline. Composition 1280x720; the GM overlay is authored at 1920x1080 and scaled by 2/3. -->

<style>
  @font-face { font-family: "CG"; font-weight: 600; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "CG"; font-weight: 600; font-style: italic; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; }
  #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #a9b3b4; }
  /* v6: saturation + toe/S-curve tables on the 3D image only (#gmgrade + #veil, written per frame by gradeAt(t) in the module) */
  #gl { position: absolute; inset: 0; width: 1280px; height: 720px; display: block; filter: saturate(0.74) url(#gmgrade); }
  #arrows { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: visible; }
  #troops, #pins { position: absolute; inset: 0; pointer-events: none; }
  #ovwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: scale(0.666667); transform-origin: 0 0; }
  #ov { position: absolute; inset: 0; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* v3 cloud white-out: GM's is a soft warm off-white with a vignette (centre ~218/218/209, edges ~190/192/181), never pure #fff */
  #whiteout { position: absolute; inset: 0; opacity: 0; pointer-events: none; overflow: hidden; }
  #wcool, #wwarm, #wisps { position: absolute; inset: 0; }
  /* v4: flat, no oval vignette (owner: his white-out is flat); cool interior ~(208,211,204), warm cream ~(217,214,201) */
  #wcool { background: rgb(208,211,204); }
  /* v5: his cream phase (637.9-638.2) has a smooth warm radial falloff: centre ~(218,216,203), edge midpoints ~(194,193,179), corners ~(186,184,170) */
  #wwarm { opacity: 0; background: radial-gradient(ellipse farthest-corner at 50% 47%, rgb(220,218,205) 0%, rgb(215,213,200) 34%, rgb(195,194,180) 71%, rgb(184,182,167) 100%); }
  .wsp { position: absolute; left: 0; top: 0; width: 600px; height: 300px; border-radius: 50%; filter: blur(38px); background: rgb(120,112,98); will-change: transform, opacity; }
  .blk { position: absolute; left: 0; top: 0; width: 100px; height: 40px; transform-origin: 50% 50%; box-sizing: border-box; border: 7px solid #15130f; will-change: transform; }
  .blk.u { background: #2c57b7; } .blk.r { background: #be3a2a; }
  .blk svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bnr { position: absolute; left: 0; top: 0; will-change: transform; transform-origin: 0 0; }
  .bnr .pole { position: absolute; left: -1px; bottom: 0; width: 2px; background: linear-gradient(#efe2b8, #8a6a2a); box-shadow: 0 0 2px rgba(0,0,0,.7); }
  .bnr img { position: absolute; left: 1px; border: 1px solid #15130f; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .bnr .nm { position: absolute; left: 4px; white-space: nowrap; font: 600 15px "CG", Georgia, serif; color: #f6f1e2; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.7); }
  .pl { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "CG", Georgia, serif; font-weight: 600; color: #f8f4e8; letter-spacing: .03em;
        text-shadow: 0 2px 3px rgba(0,0,0,.85), 0 0 7px rgba(0,0,0,.6); will-change: transform; }
  .pl.it { font-style: italic; letter-spacing: .12em; color: #e9eef0; }
  @font-face { font-family: "OSW"; font-weight: 700; src: url("assets/fonts/oswald-latin-700-normal.woff2") format("woff2"); }
  /* r18: our pins (Style W boxes / flags / the ONE ROAD stamp / the road trace), drawn the way v6 pins its DOM boxes and names */
  .ub { position: absolute; left: 0; top: 0; width: 36px; height: 24px; box-sizing: border-box; border: 2px solid #15130f; background: #bc2528; box-shadow: 0 2px 4px rgba(0,0,0,.45); will-change: transform, opacity; }
  .ub svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ub .ech { position: absolute; left: 0; right: 0; top: -11px; text-align: center; font: 700 9px "OSW", sans-serif; letter-spacing: 1px; color: #15130f; text-shadow: 0 0 2px #f4eedd; }
  .fl { position: absolute; left: 0; top: 0; width: 34px; height: auto; border: 1px solid #15130f; box-shadow: 0 2px 3px rgba(0,0,0,.5); will-change: transform, opacity; }
  .stamp { position: absolute; left: 0; top: 0; padding: 2px 10px 3px; background: #1b1914; border: 2px solid #efe6cc; outline: 2px solid #1b1914; font: italic 700 21px "OSW", sans-serif; letter-spacing: 2px; color: #f4eedd; white-space: nowrap; transform-origin: 50% 50%; will-change: transform, opacity; }
</style>
<script>
  // r18: ONE paused timeline in OUR time (the hook, 0 .. DUR s); the module maps it onto v6's clip time (tv = (t - TB) / TA) for the world,
  // the clouds, the dive and the white-out; our overlays (plaque, boxes, stamp) run on our time. v6 clip times are kept as they are.
  window.T = { D: 66.0, p4: 999, p5: 999 };   // v6 night / flashback beats: never reached in this copy
  window.__timelines = window.__timelines || {};
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady.gm3dClip = new Promise((res) => { window.__clipBuilt = res; });
  window.__clk = { t: 0 }; window.__draw = null; window.DUR = 9.2;
  const tl = gsap.timeline({ paused: true });
  tl.to(window.__clk, { t: window.DUR, duration: window.DUR, ease: "none", onUpdate: () => { if (window.__draw) window.__draw(window.__clk.t); } }, 0);
  window.__timelines["main"] = tl; window.__tl = tl;
</script>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9.2" data-width="1280" data-height="720">
  <svg width="0" height="0" style="position:absolute"><filter id="gmgrade" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%"><feComponentTransfer>
    <feFuncR type="table" tableValues="0 1"/><feFuncG type="table" tableValues="0 1"/><feFuncB type="table" tableValues="0 1"/></feComponentTransfer></filter></svg>
  <svg width="0" height="0" style="position:absolute"><filter id="r18m" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%"><feComponentTransfer>
    <feFuncR type="linear" slope="1" intercept="0"/><feFuncG type="linear" slope="1" intercept="0"/><feFuncB type="linear" slope="1" intercept="0"/></feComponentTransfer></filter></svg>
  <canvas id="gl" width="1280" height="720"></canvas>
  <div id="veil" style="position:absolute;inset:0;pointer-events:none"></div>   <!-- v6: depth-growing cool veil over the 3D image (gradeAt) -->
  <div id="pins"></div>
  <svg id="arrows" viewBox="0 0 1280 720"></svg>
  <div id="troops"></div>
  <div id="whiteout"><div id="wcool"></div><div id="wwarm"></div><div id="wisps"></div></div>
  <div id="film" style="position:absolute;inset:0;pointer-events:none"></div>   <!-- v5: the overlay's film layers (grade, paper, grain, vignette), untransformed so their blend modes reach the map -->

</div>
<script type="module">
import * as THREE from "three";
import { initWorld } from "./world.js";
import { createFX, loadCloudNoise } from "./fx.js";
const T = window.T, tl = window.__tl, D = window.GM3D_DATA, PNS = window.PINS, TT = PNS.T;
const W = 1280, H = 720, SC = 1.5;   // overlay space = 1.5 x canvas px
const U = 1 / D.geo.mpu;             // world units per metre (as v6)
const lerp = (a, b, k) => a + (b - a) * k, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
// r18 retime (linear, v6's proportions kept): v6 SW 16.4 -> our SW 7.0, v6 land 19.75 -> our 8.4  =>  ours = TA * v6 + TB
const TA = 1.4 / 3.35, TB = 7.0 - TA * 16.4, tv = (t) => (t - TB) / TA, tO = (v) => TA * v + TB;
window.__r18 = { TA, TB };

// ---------------- v6 camera beats (verbatim, v6 clip time) ----------------
const DV = { push: 12.6, deckIn: 14.7, full: 15.85, deck: 15.95, wIn: 16.05, inside: 16.25, SW: 16.4, warm: 16.55, emerge: 17.25, clear: 17.55, haze: 18.2, land: 19.75 };
const SW = DV.SW;   // region swap, inside the white-out
const keys = [
  { t: 0.0, region: "wide", at: [1560, 712], dist: 640, tilt: 46, yaw: -3, fov: 30 },
  { t: DV.push, region: "wide", at: [1532, 709], dist: 545, tilt: 44, yaw: 0, fov: 30 },
  { t: DV.deck, region: "wide", at: [1518, 707], dist: 115, tilt: 11, yaw: 1, fov: 30, ease: "in" },
  { t: SW, region: "wide", at: [1518, 706], dist: 66, tilt: 8, yaw: 1, fov: 30, ease: "lin" },   // same log-speed as the end of the cubic
  // v6 (critic A v5 #4, #6): exit at ~1/3 of the dive's log-speed (0.5/s), steady through the white, then a cubic ease-out over 2.5 s after the snap
  { t: SW, region: "close", at: [1518.0, 705.6], dist: 93, tilt: 16, yaw: 2, fov: 31, ease: "lin" },
  { t: DV.emerge, region: "close", at: [1518.5, 705.2], dist: 61, tilt: 27, yaw: 0.5, fov: 31.5, ease: "lin" },
  // r18 hand-off: v6's land key (at [1519.6, 704.6], dist 40, tilt 38, yaw -2, fov 32) is replaced by the framing of our 2D Style W camera over
  // Nelson's Ferry at the hand-off (2D camAt(8.5) = map (1310.9, 893.4), scale 13.34, tilt 7 deg -> 27.9 v6 units of height at fov 32)
  { t: DV.land, region: "close", at: [1517.41, 698.66], dist: 48.7, tilt: 7, yaw: 0, fov: 32, ease: "out" },
];
const world = initWorld(document.getElementById("gl"), { base: "assets/", keys, width: W, height: H, antialias: false, shadowSize: 1536, bridgeBurnT: null });
await world.ready;
const hC = (x, y) => world.heightAt(x, y, "close"), hW = (x, y) => world.heightAt(x, y, "wide");

const G = (x, y, h = 0) => [x, hC(x, y) + h, y], GWd = (x, y, h = 0) => [x, hW(x, y) + h, y];

// ---------------- fx: one instance per region scene (same camera + renderer) ----------------
const SUN = [-0.7, 0.48, -0.4];
const mkFX = (r, seed, hf) => createFX({ scene: world.regions[r].scene, camera: world.camera, renderer: world.renderer, unitsPerMeter: U, fxScale: r === "close" ? 9 : 40,
  wind: [20, -7], sunDir: SUN, heightAt: hf, duration: T.D, seed });
const fxW = mkFX("wide", 1863, hW), fxC = mkFX("close", 1517, hC);
fxW.patchGround(world.regions.wide.terrain.material); fxC.patchGround(world.regions.close.terrain.material);
// clouds (v5, critic A 1-6, 9, 11): true volumetric cumulus (fx.vclouds) with GM's look: smooth low-frequency lobes (no fine octave,
// mid-octave rim tearing, alpha-weighted blur of the cloud target, IGN jitter), warm cream tops, grey cores, grey-blue undersides, dark
// soft ground shadows. Wide: scattered fair-weather clouds over the whole map (log-normal sizes, big soft ones cut by the frame
// corners) + a FLAT dive deck (group 1) that closes in from the frame edges as the camera falls onto it (coverage front + density ramp,
// no billow-up); close: flat torn grey-blue stratus sheets just under the landing camera that stream past and tear open (emergence).
const M = 1 / U;   // metres per unit
const hsh = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const NOISE = await loadCloudNoise("cloudtex/noise128.bin");
const BRC = [1518, 725];   // the bridge label stays clear (wide)
// wide fair-weather cumulus: rejection-sampled scatter, clustered by a low-frequency field, log-normal radii ~10-60
// v6 (critic A v5 #5): Poisson clusters of 2-5 clouds (a big parent + smaller children), log-normal radii (sigma 0.6), irregular, clear sky between
const wsp = [], lnr = (i, k, med, sg, lo, hi) => { const g1 = hsh(i, k), g2 = hsh(i, k + 1), gn = Math.sqrt(-2 * Math.log(Math.max(1e-4, g1))) * Math.cos(6.2832 * g2); return Math.min(hi, Math.max(lo, med * Math.exp(sg * gn))); };
const offWide = (x, z, r) => Math.hypot(x - 1518, (z - 712) * 1.15) < 118 + 0.5 * r || Math.hypot(x - 1388, (z - 690) * 0.8) < 95 + r;   // the deck footprint + Vicksburg (the night flashback's frame: only the thin wisps there) stay clear
for (let c = 0, n = 0; c < 600 && n < 14; c++) {
  const cx = 1150 + hsh(c, 61) * 860, cz = 340 + hsh(c, 62) * 640, R0 = lnr(c, 63, 30, 0.6, 12, 90);
  if (offWide(cx, cz, R0) || wsp.some(([a, b, q]) => Math.hypot(a - cx, b - cz) < q + R0 + 10)) continue;
  n++; wsp.push([cx, cz, R0]); const kids = 1 + Math.floor(hsh(c, 65) * 4);   // 2-5 per cluster
  for (let k = 0; k < kids; k++) { const a = hsh(c * 7 + k, 66) * 6.283, r = lnr(c * 7 + k, 67, R0 * 0.45, 0.6, 7, R0 * 0.9), d = R0 * (0.9 + 0.8 * hsh(c * 7 + k, 69)) + r * 0.6;
    const x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d * 0.8; if (!offWide(x, z, r)) wsp.push([x, z, r]); } }
// big soft clouds cut by the frame corners of the opening shot (near the lens, lower density)
const edge = [[1290, 915, 95], [1815, 930, 85], [1175, 470, 70]];   // 3 big soft near-lens corner masses
// flat wisps around Vicksburg (the night flashback's frame; small, thin, off the town name)
const wisp = [[1318, 625, 34], [1290, 735, 40], [1440, 600, 30], [1335, 790, 32], [1470, 790, 26]];
// the dive deck: flat (H/R ~0.3) sheet cumulus around the target, dense in the camera's column (no gap to fall through), ragged towards the rim
const deck = [];
for (let i = 0, gx = 1400; gx < 1640; gx += 22) for (let gz = 600; gz < 820; gz += 22, i++) {
  const x = gx + (hsh(i, 5) - 0.5) * 18, z = gz + (hsh(i, 6) - 0.5) * 18, r = Math.hypot(x - 1518, (z - 712) * 1.15);
  if (hsh(i, 7) < lerp(0.95, 0.5, clamp((r - 30) / 90))) deck.push([x, z, 13 + hsh(i, 8) * 12]); }
for (const c of [[1518, 706, 30], [1512, 717, 26], [1526, 699, 26], [1521, 726, 26], [1507, 697, 24], [1531, 713, 24]]) deck.push(c);   // the camera's own column: no gap to fall through
const wideCl = wsp.map(([x, z, r], i) => [x, z, r, 3 + r * (0.18 + 0.16 * hsh(i, 13)), 49 + hsh(i, 11) * 9, 0])
  .concat(edge.map(([x, z, r], i) => [x, z, r, r * 0.2, 58 + i * 4, 0]))
  .concat(wisp.map(([x, z, r], i) => [x, z, r, 4 + r * 0.12, 52 + i * 2, 0]))
  .concat(deck.map(([x, z, r], i) => [x, z, r, r * (0.26 + 0.1 * hsh(i, 14) + 0.12 * clamp(1 - Math.hypot(x - 1518, z - 710) / 60)), 58 + hsh(i, 12) * 3, 1]));   // thicker over the target
// GM cloud colours: warm cream sunlit tops, grey cores, grey-blue undersides (critic A 4); night: flat grey-blue wisps (critic A 11)
const CW_DAY = { sun: [1.0, 0.95, 0.85], ambTop: [0.50, 0.55, 0.65], ambBot: [0.24, 0.28, 0.36], nSun: [0.12, 0.15, 0.20], nAmbTop: [0.27, 0.32, 0.40], nAmbBot: [0.13, 0.16, 0.21] };
const VCW = fxW.vclouds({ noise: NOISE, clouds: wideCl, bounds: [1080, 300, 2060, 1010], texel: 1, slab: [44, 104], tile: 125, groupScale: 3.0, amp: 5, soft: 1.7, flatPow: 0.3, sigma: 0.75,
  stepIn: 0.25, stepK: 0.0035, lightStep: 1.4, lodDist: 260, nearFade: 3, maxSteps: 260, resolution: 0.7, warp: 0.06, fine: 0.12, wisp: 0.45, inner: 0.8,
  weights: [1.0, 0.5, 1, 0.5], group0: [0.55, 0.3, 1.4, 0.5], blur: 1.0, sharp: 1, shadow: 0.75, shadowDir: [0.3, 1, 0.65], drift: [0.10, -0.035], evolve: 0.0025, floor: 0.05,
  sunK: 1.4, ambK: 0.18, lightK: 3.2,
  // deck: no billow-up; group-1 erosion is a coverage FRONT that sweeps from the frame edges in to the camera's column, while the deck's
  // density ramps up from translucent grey veils (0.25 s); after the swap the deck is gone from the wide map (night flashback); night: half the wide clouds, flatter
  erode: (t) => { const n = sstep(T.p4 - 1, T.p4 - 0.6, t); return [0.4 * n, t > DV.SW + 0.5 ? 9 : lerp(1.6, 0, sstep(DV.deckIn - 0.1, DV.deckIn + 0.6, t))]; },
  deck: (t) => ({ x: 1518, z: 706, r: 110, front: 3.5 * (1 - sstep(DV.deckIn + 0.1, DV.full, t)), k: lerp(0, 1, sstep(DV.deckIn, DV.deckIn + 0.6, t)) }),   // v6: opacity ramp from 0 (no pop)
  ms: (t) => lerp(0.22, 0.42, sstep(DV.full - 0.2, DV.inside, t)), expo: (t) => lerp(1, 0.93, sstep(DV.full - 0.2, DV.inside, t)),
  colors: (t) => { const k = sstep(DV.full - 0.2, DV.inside, t);   // inside the cloud: cooler, bright grey with blue-grey mottles (his 637.0 s)
    const c = sstep(DV.deckIn, DV.deckIn + 0.5, t) * (1 - k), q = Math.max(k, c);   // his deck (636.0-636.6) reads neutral-cool grey-white, his wide clouds warm
    return { sun: [lerp(1.0, 0.95, q), lerp(0.95, 0.97, q), lerp(0.85, 0.94, q)], ambTop: [lerp(0.50, 0.66, q), lerp(0.55, 0.71, q), lerp(0.65, 0.76, q)], ambBot: [lerp(0.24, 0.40, q), lerp(0.28, 0.46, q), lerp(0.36, 0.54, q)],
      nSun: CW_DAY.nSun, nAmbTop: CW_DAY.nAmbTop, nAmbBot: CW_DAY.nAmbBot, ambK: lerp(0.18, 0.36, q), lightK: lerp(3.2, 1.4, k) * lerp(1, 0.8, c), sunK: lerp(1.4, 1.2, q) }; },
  sigmaK: (t) => lerp(1, 0.5, sstep(DV.full, DV.inside, t)) });
// close (v6, critic A v5 #4): 10 separate torn stratus sheets with holes (~35-50 % of the frame at the snap), flat, low (tops ~19-24, about a
// third of the way up to the camera = ~1.5x the ground's parallax), lit tops + grey-blue cores; they clear off the troop line after ~18.3 s and tear away by ~20.5
const closeCl = [], SH = [[1509, 696, 9], [1531, 694, 8], [1505, 712, 10], [1534, 716, 9], [1519, 724, 8], [1520, 688, 7], [1497, 703, 7], [1541, 705, 7], [1512, 705, 6], [1527, 706, 6]];
SH.forEach(([x, z, r], i) => closeCl.push([x, z, r * 1.25, 2.6 + hsh(i, 24) * 1.2, 16.5 + hsh(i, 25) * 3, 1]));
const VCC = fxC.vclouds({ noise: NOISE, clouds: closeCl, bounds: [1470, 660, 1570, 750], texel: 0.2, skip: 8, slab: [14, 26], tile: 9, amp: 1.5, soft: 0.8, sigma: 1.1, wisp: 0.8, inner: 0.7, flatPow: 0.35, blobs: 6,
  stepIn: 0.12, stepK: 0.004, lightStep: 0.35, lodDist: 90, nearFade: 1.2, maxSteps: 220, resolution: 0.7, warp: 0.18, fine: 0.1, weights: [1.0, 0.5, 1, 0.6], blur: 1.0, sharp: 1,
  shadow: 0.45, shadowDir: [0.3, 1, 0.65], drift: [0.5, -0.18], evolve: 0.006, sunK: 0.95, ambK: 0.5, lightK: 1.6,
  colors: { sun: [1.0, 0.97, 0.9], ambTop: [0.62, 0.67, 0.74], ambBot: [0.30, 0.35, 0.44] },
  erode: (t) => [0, lerp(0.35, 0.7, sstep(DV.emerge, DV.emerge + 1.2, t)) + lerp(0, 2.2, sstep(DV.emerge + 1.0, DV.emerge + 3.3, t))],
  deck: (t) => ({ x: 1524, z: 705, r: 9, front: 3 * sstep(DV.emerge + 0.9, DV.emerge + 1.6, t), k: 1 }),   // the troop line clears first
  opacity: (t) => 1 - sstep(DV.emerge + 3.2, DV.emerge + 3.8, t) });


// the battle's drifting cloud shadows (as in v3): the old noise layer, shadows only (its own pass stays off)
fxC.clouds({ base: 48 * M, top: 104 * M, tile: 260 * M, coverage: 0.36, shadow: 0.40, opacity: 0, detail: 0.5 });

// cold open: the bridge already burning, seen from altitude (a fleck of fire + a dark column bending downwind)
// v5 (critic B 6): orange flame tongues (no white clipping) under a dark leaning smoke column
const GP = {   // sat, toe (0-255 lift at black), S strength, blue/green lift (table offsets at mid), veil rgb, veil alpha top/bottom
  close: { sat: 0.98, toe: 4, S: 0.14, bl: 7, gl: 1, veil: [150, 160, 165], vt: 0.15, vb: 0.04, ct: 1.0 },   // v7: ct = contrast about mid-grey; kept 1.0 (with terrain v7 the close SD is already ~10 % under his)
  wide: { sat: 0.95, toe: 14, S: 0.1, bl: 4, gl: 1, veil: [150, 160, 165], vt: 0.0, vb: 0.0, ct: 0.96 },   // v7: no veil on the wide map (it greyed the clouds, critic A); toe up instead
  night: { sat: 0.95, toe: 2, S: 0.0, bl: 5, gl: 2, veil: [40, 60, 82], vt: 0.04, vb: 0.0, ct: 1.0 },
  off: { sat: 1.05, toe: 0, S: 0, bl: 0, gl: 0, veil: [150, 160, 165], vt: 0, vb: 0, ct: 1.0 } };
const GF = [...document.querySelectorAll("#gmgrade feFuncR, #gmgrade feFuncG, #gmgrade feFuncB")], GL = document.getElementById("gl"), VEIL = document.getElementById("veil");
const GRADE_ON = new URLSearchParams(location.search).get("grade") !== "0";   // ?grade=0: raw image (for measuring)
let gradeKey = "";
