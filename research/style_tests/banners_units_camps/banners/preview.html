<!doctype html>
<html><head><meta charset="utf-8"><title>General's banner preview</title>
<style>
html,body{margin:0;background:#111}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:url("../../../../grant/assets/vicksburg_w.jpg") -2250px -760px/4800px 2700px no-repeat}
.lbl{position:absolute;top:22px;left:26px;font:700 22px "Liberation Sans",Arial,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:4px 12px;letter-spacing:.04em}
/* stand-in for a Style W unit block (B.unit): the banner is pinned to its first child */
.unit{position:absolute;width:0;height:0}
.unit>.blk{position:absolute;left:-17px;top:-7px;width:34px;height:14px;border:1.6px solid #15110c;box-sizing:border-box}
.unit.us>.blk{background:#2f55a4}.unit.cs>.blk{background:#b3322c}
.cap{position:absolute;font:600 14px "Liberation Sans",Arial,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;transform:translateX(-50%);white-space:nowrap}
</style></head>
<body>
<div id="stage"><div class="lbl">GENERAL'S BANNER (banner.js) - 1080p frame, real size</div></div>
<script src="../../../../grant/vendor/gsap.min.js"></script>
<script>var BN_FONT_BASE = "../../rr_cards/fonts/"; var tl = gsap.timeline({ paused: true });</script>
<script src="banner.js"></script>
<script>
const M = "../../../../grant/assets/media/";
const PHOTO = (n) => `${M}${n}_head.png`;
const S = document.getElementById("stage");
const unit = (side, x, y) => { const u = document.createElement("div"); u.className = "unit " + side; u.style.left = x + "px"; u.style.top = y + "px";
  u.innerHTML = '<div class="blk"></div>'; S.appendChild(u); return u.firstElementChild; };
const cap = (txt, x, y) => { const c = document.createElement("div"); c.className = "cap"; c.textContent = txt; c.style.left = x + "px"; c.style.top = y + "px"; S.appendChild(c); };
const pin = (side, x, y, photo, flag, name, pos = "up") => { const w = BN.build(photo, flag, name, pos); unit(side, x, y).appendChild(w); BN.sway(w, 0, 20); return w; };
// main pair (the comparison crop): Grant (Union, May 1863 -> 34 stars) and Pemberton (Confederate, Stars and Bars)
pin("us", 260, 420, PHOTO("grant"), BN.flagFor("us", "1863-05-18", M), "Grant"); cap("Grant (US 34 stars)", 260, 440);
pin("cs", 520, 420, PHOTO("pemberton"), BN.flagFor("cs", "1863-05-18", M), "Pemberton"); cap("Pemberton (CS First National)", 520, 440);
// mystery "?" on a side stake, and the same after BN.reveal (seeked below)
pin("us", 760, 420, BN.MYST, BN.flagFor("us", "1863-05-18", M), "Union General", "right"); cap('mystery "?" (side right)', 830, 480);
const g = pin("us", 1010, 420, BN.MYST, BN.flagFor("us", "1863-05-18", M), "Union General", "right"); BN.reveal(g, PHOTO("grant"), "Ulysses Grant", 1.0); cap("after BN.reveal", 1080, 480);
// second band: long names, 35-star flag after 4 Jul 1863, the scene's own opaque MYST
pin("cs", 300, 900, PHOTO("pemberton"), BN.flagFor("cs", "1863-07-04", M), "John C. Pemberton"); cap("long name", 300, 920);
pin("us", 560, 900, PHOTO("grant"), BN.flagFor("us", "1863-07-04", M), "Ulysses S. Grant"); cap("from 4 Jul 1863: 35 stars", 560, 920);
pin("us", 800, 900, PHOTO("sherman"), BN.flagFor("us", "1863-05-18", M), "Sherman"); cap("Sherman", 800, 920);
pin("cs", 1040, 900, PHOTO("johnston"), BN.flagFor("cs", "1863-05-18", M), "Joseph E. Johnston"); cap("Johnston", 1040, 920);
// sway phases for the 2x strip (rendered separately by render_preview.js via ?t=)
const T = parseFloat(new URLSearchParams(location.search).get("t") || "1.3"); tl.seek(T, false);
Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => 0))]).then(() => { document.body.dataset.ready = "1"; });
</script>
</body></html>
