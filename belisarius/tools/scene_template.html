<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="lib/battle.js"></script>
    <link rel="stylesheet" href="lib/battle.css" />
    <style>
@font-face { font-family: "Oswald"; font-weight: 500; src: url("assets/fonts/oswald-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Oswald"; font-weight: 700; src: url("assets/fonts/oswald-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Special Elite"; font-weight: 400; src: url("assets/fonts/special-elite-latin-400-normal.woff2") format("woff2"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
        <div id="world">
          <img id="relief" src="assets/relief.jpg" alt="" />
          <svg id="overlay" viewBox="0 0 2880 1620" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="pins"></div>
        </div>
        <div id="fx"></div>
        <div id="vignette"></div>
        <img id="grain" src="assets/grain.png" alt="" />
        <div id="date"><div class="scroll"></div><div class="roll l"></div><div class="roll r"></div></div>
        <div id="credit">{{CREDIT}}</div>
      </div>
    </div>
    <script>
{{SCENE_JS}}
      window.__timelines["main"] = B.tl;
      B.tl.seek(0);
    </script>
  </body>
</html>
